<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nočná misia: Salzburg</title>
<style>
  :root{
    --bg:#0f1117;
    --surface:#151924;
    --surface2:#1c2130;
    --line:#272e3f;
    --ink:#e9ecf2;
    --muted:#8b93a5;
    --accent:#f2b13d;
    --accent-ink:#1a1405;
    --green:#46c47d;
    --danger:#e5606c;
    --radius:12px;
    --ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--ui);
    font-size:16px;
    line-height:1.5;
    min-height:100vh;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  button{font-family:var(--ui);cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  img{max-width:100%;display:block}
  svg{flex:none}

  /* ---------- header ---------- */
  header{
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:20px 16px 16px;
  }
  .head-inner,main{max-width:640px;margin:0 auto}
  .eyebrow{
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }
  h1{
    font-weight:800;font-size:clamp(24px,6.5vw,30px);line-height:1.15;
    letter-spacing:-.02em;text-wrap:balance;margin-top:2px;
  }
  .groom-line{color:var(--muted);font-size:14px;margin-top:2px}
  .groom-line b{color:var(--ink);font-weight:600}
  .scorebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:16px}
  .score{
    font-size:32px;font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1;
  }
  .score small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
  .rank{
    font-size:12px;font-weight:600;color:var(--accent);
    border:1px solid var(--line);background:var(--surface2);
    border-radius:999px;padding:5px 12px;white-space:nowrap;
  }
  .progress{height:4px;background:var(--surface2);border-radius:999px;margin-top:12px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease;width:0}

  main{padding:16px}

  /* ---------- quest cards ---------- */
  .quest{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .q-top{display:flex;align-items:flex-start;gap:12px}
  .q-num{
    width:32px;height:32px;border-radius:8px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface2);border:1px solid var(--line);
    font-size:13px;font-weight:700;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .quest.done .q-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .quest.verified .q-num{background:var(--green);border-color:var(--green);color:#08170e}
  .q-head{flex:1;min-width:0}
  .q-title{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .q-meta{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:12px;color:var(--muted)}
  .q-pts{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .q-desc{color:var(--muted);font-size:14px;margin-top:10px;max-width:60ch}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px;margin-top:12px;
  }
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.wait{color:var(--accent);background:rgba(242,177,61,.1)}
  .badge.ok{color:var(--green);background:rgba(70,196,125,.1)}

  .subs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .subs label{display:flex;align-items:center;gap:10px;font-size:15px}
  .subs input{width:19px;height:19px;accent-color:var(--accent);flex:none}

  .counters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .counter{
    display:flex;align-items:center;gap:8px;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 12px;
  }
  .counter .c-label{font-size:12px;font-weight:600;color:var(--muted)}
  .counter .c-val{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px;text-align:center;font-size:14px}
  .counter .c-val.full{color:var(--green)}
  .counter button{
    width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);
    font-size:17px;font-weight:600;color:var(--ink);line-height:1;
  }
  .counter button:disabled{opacity:.35;cursor:default}

  .evidence{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px}
  .thumbs:empty{display:none}
  .thumbs img{
    width:60px;height:60px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);cursor:pointer;
  }
  .btn-row{display:flex;flex-wrap:wrap;gap:8px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;
    background:var(--surface2);border:1px solid var(--line);color:var(--ink);
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:disabled{background:var(--surface2);border-color:var(--line);color:var(--muted);cursor:default}
  .btn.ghost-danger{color:var(--danger);border-color:transparent;background:rgba(229,96,108,.08)}
  textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-family:var(--ui);font-size:15px;padding:10px 12px;min-height:60px;resize:vertical;
  }
  textarea::placeholder{color:var(--muted)}
  textarea:disabled{opacity:.6}
  .need-hint{font-size:12.5px;color:var(--muted)}

  /* ---------- memories ---------- */
  .mem-head{margin:4px 0 20px}
  .mem-head h2,.crew-head h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .mem-head p{color:var(--muted);font-size:14px;max-width:55ch;margin-top:4px}
  .mem-task{margin-bottom:24px}
  .mem-task h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .mem-meta{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
  .mem-meta .v{color:var(--green)}
  .mem-note{
    background:var(--surface);border-left:2px solid var(--accent);border-radius:0 9px 9px 0;
    padding:10px 14px;font-family:Georgia,serif;font-style:italic;font-size:15.5px;
    color:var(--ink);margin-bottom:10px;
  }
  .mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .mem-grid:empty{display:none}
  .mem-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:56px 24px;font-size:14.5px;max-width:34ch;margin:0 auto}

  /* ---------- crew ---------- */
  .crew-head{margin:4px 0 16px}
  .crew-head p{color:var(--muted);font-size:14px;margin-top:4px}
  .pin-box{max-width:300px;margin:48px auto;text-align:center}
  .pin-box h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
  .pin-box .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .pin-box input{
    width:100%;text-align:center;font-size:26px;letter-spacing:.4em;padding:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .pin-err{color:var(--danger);font-size:13px;min-height:20px;margin:8px 0 4px}
  .crew-item{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
  }
  .crew-tools{margin-top:24px;border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px}
  .crew-tools h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .field label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
  .field input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-size:15px;padding:10px 12px;
  }

  /* ---------- tabs ---------- */
  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:rgba(15,17,23,.92);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;padding:9px 4px 10px;color:var(--muted);font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav button.active{color:var(--accent)}

  /* ---------- modals ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,10,14,.82);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .overlay[hidden]{display:none}
  .modal{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:24px;max-width:400px;width:100%;
  }
  .modal h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;text-wrap:balance}
  .modal p{color:var(--muted);font-size:14px;margin-bottom:16px}
  .modal .field{margin-bottom:12px}
  .lightbox{align-items:stretch;padding:0;flex-direction:column;background:rgba(8,10,14,.96)}
  .lightbox img{margin:auto;max-height:80vh;max-width:100%;object-fit:contain}
  .lightbox .lb-bar{display:flex;justify-content:space-between;gap:8px;padding:14px}

  /* ---------- celebration ---------- */
  .final{
    background:var(--surface);
    border:1px solid var(--accent);border-radius:var(--radius);
    text-align:center;padding:28px 20px;margin-bottom:14px;
  }
  .final .f-pts{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
  .final h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
  .final p{color:var(--muted);font-size:14px;max-width:42ch;margin:0 auto}

  .confetti-bit{
    position:fixed;top:-20px;z-index:99;width:8px;height:14px;border-radius:2px;
    pointer-events:none;animation:fall linear forwards;
  }
  @keyframes fall{to{transform:translateY(110vh) rotate(680deg);opacity:.85}}
  @media (prefers-reduced-motion:reduce){
    .confetti-bit{display:none}
    .progress i{transition:none}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="eyebrow">Salzburg &middot; Rozlúčka so slobodou</div>
    <h1>Nočná misia</h1>
    <div class="groom-line">Agent v teréne: <b id="groomName">Ženích</b></div>
    <div class="scorebar">
      <div class="score"><span id="scoreVal">0</span><small> / <span id="scoreMax">100</span> bodov</small></div>
      <div class="rank" id="rankVal">Zelenáč</div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>
</header>

<main>
  <section id="view-quests"></section>
  <section id="view-memories" hidden></section>
  <section id="view-crew" hidden></section>
</main>

<nav>
  <button id="tab-quests" class="active" onclick="showView('quests')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.5" fill="currentColor"/></svg>
    Misie
  </button>
  <button id="tab-memories" onclick="showView('memories')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 15.5l-4.2-4.2a1.5 1.5 0 0 0-2.1 0L7 19"/></svg>
    Spomienky
  </button>
  <button id="tab-crew" onclick="showView('crew')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>
    Porota
  </button>
</nav>

<div class="overlay" id="setupOverlay" hidden>
  <div class="modal">
    <h2>Pripraviť misiu</h2>
    <p>Jedna noc, desať misií, sto bodov. Salzburg netuší, čo ho čaká.</p>
    <div class="field">
      <label for="inGroom">Meno ženícha</label>
      <input id="inGroom" type="text" placeholder="napr. Peťo" autocomplete="off">
    </div>
    <div class="field">
      <label for="inBride">Meno nevesty (pre misiu č. 7)</label>
      <input id="inBride" type="text" placeholder="napr. Katka" autocomplete="off">
    </div>
    <button class="btn primary" style="width:100%" onclick="finishSetup()">Spustiť misiu</button>
  </div>
</div>

<div class="overlay lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <button class="btn ghost-danger" id="lbDelete">Vymazať</button>
    <button class="btn" onclick="closeLightbox()">Zavrieť</button>
  </div>
  <img id="lbImg" alt="Fotka z misie">
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script>
'use strict';

/* ====== konfigurácia ====== */
const CREW_PIN = '1234';           // PIN pre porotu — zmeňte pred akciou!
const POINTS_PER_TASK = 10;

const TASKS = [
  {id:'zlozky', num:1, title:'Záchranné zložky',
   desc:'Odfoť sa s policajtom, hasičom a zdravotníkom. Všetci traja sa počítajú, žiadne kostýmy.',
   subs:['Policajt','Hasič','Zdravotník'], need:'photo'},
  {id:'para30', num:2, title:'Rada od skúsených',
   desc:'Nájdi pár, ktorý je spolu viac ako 30 rokov, a vypýtaj si od nich jednu radu do manželstva.',
   need:'note', notePrompt:'Zapíš radu do manželstva, ktorú ti dali…'},
  {id:'kpn', num:3, title:'Kameň – papier – nožnice',
   desc:'Vyzvi 5 cudzích ľudí na kameň–papier–nožnice a vyhraj aspoň 3 súboje.',
   counters:[{key:'duely',label:'Súboje',target:5},{key:'vyhry',label:'Výhry',target:3}]},
  {id:'potlesk', num:4, title:'Standing ovation',
   desc:'Prinúť celý podnik, aby ti zatlieskal — bez toho, aby si vysvetlil prečo.'},
  {id:'pantomima', num:5, title:'Tichá objednávka',
   desc:'Objednaj drinky pre celú partiu výhradne pantomímou. Ani slovo, ani písmenko.'},
  {id:'partia', num:6, title:'Starí kamoši',
   desc:'Presvedč úplne cudziu partiu, aby si spravila spoločnú fotku s tebou ako s dávnym kamošom.',
   need:'photo'},
  {id:'meno', num:7, title:'Menovkyňa nevesty',
   desc:'Nájdi osobu s rovnakým menom, ako má nevesta, a odfoť sa s ňou.',
   need:'photo', brideTask:true},
  {id:'psy', num:8, title:'Psia smečka',
   desc:'Odfoť sa s 10 rôznymi psami. Každý pes sa počíta len raz — fotky sú dôkaz.',
   need:'photo', photoCounter:{label:'Psy',target:10}},
  {id:'podpivnik', num:9, title:'Trofej z baru',
   desc:'Získaj podpivník s vlastnoručným podpisom barmana a odfoť ho.',
   need:'photo'},
  {id:'vreckovka', num:10, title:'Umelec noci',
   desc:'Nakresli niekoho na vreckovku a slávnostne mu ju odovzdaj ako jeho portrét.',
   need:'photo'},
];

const RANKS = [
  [0,'Zelenáč'],[20,'Učeň noci'],[40,'Provokatér'],[60,'Majster misií'],
  [80,'Kráľ večera'],[100,'Legenda Salzburgu'],
];

/* ====== stav ====== */
const STATE_KEY = 'bpq_state_v1';
let state = loadState();
let crewUnlocked = false;
let activeView = 'quests';
let photoTargetTask = null;
let lightboxPhotoId = null;

function defaultState(){
  const tasks = {};
  for (const t of TASKS){
    tasks[t.id] = {
      status:'open', note:'',
      subs:(t.subs||[]).map(()=>false),
      counters:(t.counters||[]).map(()=>0),
      photos:[], doneAt:null, verifiedAt:null,
    };
  }
  return {groom:'', bride:'', setupDone:false, tasks};
}
function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    for(const t of TASKS){ if(!s.tasks[t.id]) s.tasks[t.id] = d.tasks[t.id]; }
    return s;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

/* ====== IndexedDB pre fotky ====== */
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res,rej)=>{
    const req = indexedDB.open('bpq_photos',1);
    req.onupgradeneeded = ()=>req.result.createObjectStore('photos',{keyPath:'id'});
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
  return dbPromise;
}
async function putPhoto(rec){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').put(rec);
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
async function getPhoto(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const req = db.transaction('photos').objectStore('photos').get(id);
    req.onsuccess = ()=>res(req.result); req.onerror = ()=>rej(req.error);
  });
}
async function deletePhotoRec(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
async function getAllPhotos(){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const req = db.transaction('photos').objectStore('photos').getAll();
    req.onsuccess = ()=>res(req.result||[]); req.onerror = ()=>rej(req.error);
  });
}
async function clearPhotos(){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').clear();
    tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
  });
}
const photoCache = {};
async function photoURL(id){
  if(photoCache[id]) return photoCache[id];
  const rec = await getPhoto(id);
  if(rec){ photoCache[id] = rec.data; return rec.data; }
  return null;
}

/* ====== herná logika ====== */
function taskDef(id){ return TASKS.find(t=>t.id===id); }
function taskDone(ts){ return ts.status==='done' || ts.status==='verified'; }
function score(){
  let s = 0;
  for(const t of TASKS) if(taskDone(state.tasks[t.id])) s += POINTS_PER_TASK;
  return s;
}
function rankFor(s){
  let r = RANKS[0][1];
  for(const [min,name] of RANKS) if(s>=min) r = name;
  return r;
}
function requirementsMet(t){
  const ts = state.tasks[t.id];
  if(t.subs && !ts.subs.every(Boolean)) return false;
  if(t.counters && !t.counters.every((c,i)=>ts.counters[i]>=c.target)) return false;
  if(t.photoCounter && ts.photos.length < t.photoCounter.target) return false;
  if(t.need==='photo' && ts.photos.length===0) return false;
  if(t.need==='note' && !ts.note.trim()) return false;
  return true;
}
function missingText(t){
  const ts = state.tasks[t.id];
  const parts = [];
  if(t.subs && !ts.subs.every(Boolean)) parts.push('odškrtni všetky položky');
  if(t.counters) for(let i=0;i<t.counters.length;i++)
    if(ts.counters[i]<t.counters[i].target) parts.push(`${t.counters[i].label.toLowerCase()}: ${ts.counters[i]}/${t.counters[i].target}`);
  if(t.photoCounter && ts.photos.length<t.photoCounter.target) parts.push(`fotky psov: ${ts.photos.length}/${t.photoCounter.target}`);
  if(t.need==='photo' && ts.photos.length===0) parts.push('pridaj aspoň 1 fotku');
  if(t.need==='note' && !ts.note.trim()) parts.push('zapíš poznámku');
  return parts.length ? 'Ešte treba: ' + parts.join(' · ') : '';
}
function taskDesc(t){
  if(t.brideTask && state.bride)
    return `Nájdi osobu s menom ${state.bride} a odfoť sa s ňou. Občianka je bonus.`;
  return t.desc;
}

/* ====== render: hlavička ====== */
function renderHeader(){
  const s = score();
  document.getElementById('groomName').textContent = state.groom || 'Ženích';
  document.getElementById('scoreVal').textContent = s;
  document.getElementById('scoreMax').textContent = TASKS.length*POINTS_PER_TASK;
  document.getElementById('rankVal').textContent = rankFor(s);
  document.getElementById('progressBar').style.width = (s/(TASKS.length*POINTS_PER_TASK)*100)+'%';
}

/* ====== render: misie ====== */
function esc(x){ return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function numChip(n){ return String(n).padStart(2,'0'); }

function renderQuests(){
  const root = document.getElementById('view-quests');
  const s = score();
  let html = '';
  if(s >= TASKS.length*POINTS_PER_TASK){
    html += `<div class="final"><div class="f-pts">${s} / ${TASKS.length*POINTS_PER_TASK} bodov</div>
      <h2>Legenda Salzburgu</h2>
      <p>${esc(state.groom||'Ženích')} splnil všetkých ${TASKS.length} misií. Salzburg sa z tejto noci bude spamätávať roky.</p></div>`;
  }
  for(const t of TASKS){
    const ts = state.tasks[t.id];
    const done = taskDone(ts);
    html += `<article class="quest ${ts.status==='verified'?'verified':done?'done':''}" id="q-${t.id}">
      <div class="q-top">
        <div class="q-num">${numChip(t.num)}</div>
        <div class="q-head">
          <h3 class="q-title">${esc(t.title)}</h3>
          <div class="q-meta"><span class="q-pts">+${POINTS_PER_TASK} b</span></div>
        </div>
      </div>
      <p class="q-desc">${esc(taskDesc(t))}</p>`;

    if(ts.status==='done') html += `<span class="badge wait">Čaká na overenie porotou</span>`;
    if(ts.status==='verified') html += `<span class="badge ok">Overené porotou</span>`;

    if(t.subs){
      html += `<div class="subs">` + t.subs.map((label,i)=>
        `<label><input type="checkbox" ${ts.subs[i]?'checked':''} ${done?'disabled':''}
          onchange="toggleSub('${t.id}',${i},this.checked)"> ${esc(label)}</label>`).join('') + `</div>`;
    }
    if(t.counters){
      html += `<div class="counters">` + t.counters.map((c,i)=>{
        const v = ts.counters[i];
        return `<div class="counter"><span class="c-label">${esc(c.label)}</span>
          <button ${done||v<=0?'disabled':''} onclick="bumpCounter('${t.id}',${i},-1)" aria-label="Menej">&minus;</button>
          <span class="c-val ${v>=c.target?'full':''}">${v} / ${c.target}</span>
          <button ${done||v>=99?'disabled':''} onclick="bumpCounter('${t.id}',${i},1)" aria-label="Viac">+</button></div>`;
      }).join('') + `</div>`;
    }
    if(t.photoCounter){
      const v = ts.photos.length;
      html += `<div class="counters"><div class="counter"><span class="c-label">${esc(t.photoCounter.label)}</span>
        <span class="c-val ${v>=t.photoCounter.target?'full':''}">${v} / ${t.photoCounter.target}</span></div></div>`;
    }

    html += `<div class="evidence">
      <div class="thumbs" id="thumbs-${t.id}"></div>
      <textarea placeholder="${esc(t.notePrompt||'Poznámka, hláška, meno, skóre… (nepovinné)')}"
        oninput="setNote('${t.id}',this.value)" ${ts.status==='verified'?'disabled':''}>${esc(ts.note)}</textarea>
      <div class="btn-row">
        <button class="btn" onclick="addPhoto('${t.id}')" ${ts.status==='verified'?'disabled':''}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h2.5l1.5-2.5h8L17.5 8H20a1.5 1.5 0 0 1 1.5 1.5V18A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9.5A1.5 1.5 0 0 1 4 8z"/><circle cx="12" cy="13.5" r="3.2"/></svg>
          Pridať fotku</button>`;
    if(!done){
      const ok = requirementsMet(t);
      html += `<button class="btn primary" ${ok?'':'disabled'} onclick="markDone('${t.id}')">Splnené</button>`;
    } else if(ts.status==='done'){
      html += `<button class="btn" onclick="undoDone('${t.id}')">Vrátiť</button>`;
    }
    html += `</div>`;
    const miss = !done ? missingText(t) : '';
    if(miss) html += `<div class="need-hint">${esc(miss)}</div>`;
    html += `</div></article>`;
  }
  root.innerHTML = html;
  for(const t of TASKS) renderThumbs(t.id, `thumbs-${t.id}`);
}

async function renderThumbs(taskId, elId){
  const el = document.getElementById(elId);
  if(!el) return;
  const ts = state.tasks[taskId];
  const imgs = [];
  for(const pid of ts.photos){
    const url = await photoURL(pid);
    if(url) imgs.push(`<img src="${url}" alt="Fotka k misii" loading="lazy" onclick="openLightbox('${taskId}','${pid}')">`);
  }
  el.innerHTML = imgs.join('');
}

/* ====== akcie ženícha ====== */
function toggleSub(id,i,val){ state.tasks[id].subs[i]=val; saveState(); refresh(); }
function bumpCounter(id,i,d){
  const ts = state.tasks[id];
  ts.counters[i] = Math.max(0, ts.counters[i]+d);
  saveState(); refresh();
}
let noteTimers = {};
function setNote(id,val){
  state.tasks[id].note = val;
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(()=>{ saveState(); renderHeaderOnlyIfNeeded(id); }, 400);
}
function renderHeaderOnlyIfNeeded(id){
  const t = taskDef(id);
  if(t.need==='note') refresh();  // odomkne tlačidlo Splnené
  else saveState();
}
function markDone(id){
  const t = taskDef(id);
  if(!requirementsMet(t)) return;
  state.tasks[id].status = 'done';
  state.tasks[id].doneAt = Date.now();
  saveState(); refresh();
  confetti(26);
  if(score() >= TASKS.length*POINTS_PER_TASK) confetti(90);
}
function undoDone(id){
  state.tasks[id].status = 'open';
  state.tasks[id].doneAt = null;
  saveState(); refresh();
}

/* ====== fotky ====== */
function addPhoto(taskId){
  photoTargetTask = taskId;
  document.getElementById('photoInput').click();
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('photoInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file || !photoTargetTask) return;
    try{
      const data = await compressImage(file);
      const id = 'p' + Date.now() + Math.random().toString(36).slice(2,7);
      await putPhoto({id, taskId:photoTargetTask, data, ts:Date.now()});
      photoCache[id] = data;
      state.tasks[photoTargetTask].photos.push(id);
      saveState(); refresh();
    }catch(err){
      alert('Fotku sa nepodarilo uložiť: ' + err.message);
    }
  });
});
function compressImage(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const MAX = 1400;
      let {width:w, height:h} = img;
      if(Math.max(w,h) > MAX){ const k = MAX/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('nepodporovaný formát')); };
    img.src = url;
  });
}
function openLightbox(taskId, photoId){
  lightboxPhotoId = photoId;
  photoURL(photoId).then(url=>{
    if(!url) return;
    document.getElementById('lbImg').src = url;
    const del = document.getElementById('lbDelete');
    const verified = state.tasks[taskId].status==='verified';
    del.hidden = verified && !crewUnlocked;
    del.onclick = async ()=>{
      if(!confirm('Naozaj vymazať túto fotku?')) return;
      await deletePhotoRec(photoId);
      delete photoCache[photoId];
      const ts = state.tasks[taskId];
      ts.photos = ts.photos.filter(p=>p!==photoId);
      saveState(); closeLightbox(); refresh();
    };
    document.getElementById('lightbox').hidden = false;
  });
}
function closeLightbox(){ document.getElementById('lightbox').hidden = true; lightboxPhotoId = null; }

/* ====== spomienky ====== */
async function renderMemories(){
  const root = document.getElementById('view-memories');
  const doneTasks = TASKS.filter(t=>{
    const ts = state.tasks[t.id];
    return ts.photos.length || ts.note.trim() || taskDone(ts);
  });
  const s = score();
  let html = `<div class="mem-head"><h2>Spomienky na Salzburg</h2>
    <p>${esc(state.groom||'Ženích')} &middot; ${s} bodov &middot; ${esc(rankFor(s))}. Všetko, čo sa tú noc stalo — fotky aj hlášky.</p></div>`;
  if(!doneTasks.length){
    html += `<div class="empty">Zatiaľ prázdno. Noc je mladá — prvá spomienka pribudne po prvej misii.</div>`;
    root.innerHTML = html; return;
  }
  for(const t of doneTasks){
    const ts = state.tasks[t.id];
    const when = ts.doneAt ? new Date(ts.doneAt).toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'}) : null;
    const stat = ts.status==='verified' ? '<span class="v">overené porotou</span>'
      : taskDone(ts) ? 'čaká na overenie' : 'rozpracované';
    html += `<div class="mem-task"><h3>${numChip(t.num)} &middot; ${esc(t.title)}</h3>
      <div class="mem-meta">${stat}${when?' &middot; splnené o '+when:''}</div>`;
    if(ts.note.trim()) html += `<div class="mem-note">„${esc(ts.note.trim())}“</div>`;
    html += `<div class="mem-grid" id="mem-thumbs-${t.id}"></div></div>`;
  }
  root.innerHTML = html;
  for(const t of doneTasks) renderThumbs(t.id, `mem-thumbs-${t.id}`);
}

/* ====== porota ====== */
function renderCrew(){
  const root = document.getElementById('view-crew');
  if(!crewUnlocked){
    root.innerHTML = `<div class="pin-box">
      <h2>Vstup pre porotu</h2>
      <p class="sub">Len pre členov výpravy. Ženích, ruky preč.</p>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="····"
        onkeydown="if(event.key==='Enter')tryPin()">
      <div class="pin-err" id="pinErr"></div>
      <button class="btn primary" style="width:100%" onclick="tryPin()">Odomknúť</button>
    </div>`;
    return;
  }
  let html = `<div class="crew-head"><h2>Porota</h2>
    <p>Overte splnené misie. Bez pečiatky poroty to nie je oficiálne.</p></div>`;
  for(const t of TASKS){
    const ts = state.tasks[t.id];
    const stat = ts.status==='verified' ? `<span class="badge ok">Overené</span>`
      : ts.status==='done' ? `<span class="badge wait">Na overenie</span>` : '';
    html += `<div class="crew-item">
      <div class="q-top">
        <div class="q-num">${numChip(t.num)}</div>
        <div class="q-head">
          <h3 class="q-title">${esc(t.title)}</h3>
          <div class="q-meta"><span class="q-pts">${taskDone(ts)?'+'+POINTS_PER_TASK+' b':'0 b'}</span></div>
        </div>
      </div>
      ${stat}
      ${ts.note.trim()?`<div class="mem-note" style="margin-top:12px">„${esc(ts.note.trim())}“</div>`:''}
      <div class="thumbs" id="crew-thumbs-${t.id}" style="margin-top:12px"></div>
      <div class="btn-row" style="margin-top:12px">`;
    if(ts.status==='done'){
      html += `<button class="btn primary" onclick="verifyTask('${t.id}')">Overiť</button>
        <button class="btn ghost-danger" onclick="rejectTask('${t.id}')">Zamietnuť</button>`;
    } else if(ts.status==='verified'){
      html += `<button class="btn" onclick="unverifyTask('${t.id}')">Zrušiť overenie</button>`;
    } else {
      html += `<span class="need-hint">Ženích ju ešte neoznačil ako splnenú.</span>`;
    }
    html += `</div></div>`;
  }
  html += `<div class="crew-tools">
    <h3>Nastavenia výpravy</h3>
    <div class="field"><label for="setGroom">Meno ženícha</label>
      <input id="setGroom" type="text" value="${esc(state.groom)}" onchange="state.groom=this.value;saveState();refresh()"></div>
    <div class="field"><label for="setBride">Meno nevesty</label>
      <input id="setBride" type="text" value="${esc(state.bride)}" onchange="state.bride=this.value;saveState();refresh()"></div>
    <button class="btn" onclick="exportBackup()">Stiahnuť zálohu (JSON s fotkami)</button>
    <button class="btn" onclick="document.getElementById('importInput').click()">Načítať zálohu</button>
    <input type="file" id="importInput" accept="application/json" hidden onchange="importBackup(this.files[0])">
    <button class="btn ghost-danger" onclick="resetAll()">Vymazať celú hru</button>
  </div>`;
  root.innerHTML = html;
  for(const t of TASKS) renderThumbs(t.id, `crew-thumbs-${t.id}`);
}
function tryPin(){
  const v = document.getElementById('pinInput').value;
  if(v === CREW_PIN){ crewUnlocked = true; renderCrew(); }
  else document.getElementById('pinErr').textContent = 'Nesprávny PIN. Skús šťastie inde, ženích.';
}
function verifyTask(id){
  state.tasks[id].status = 'verified';
  state.tasks[id].verifiedAt = Date.now();
  saveState(); refresh(); confetti(18);
}
function rejectTask(id){
  if(!confirm('Zamietnuť? Misia sa vráti ženíchovi ako nesplnená.')) return;
  state.tasks[id].status = 'open';
  state.tasks[id].doneAt = null;
  saveState(); refresh();
}
function unverifyTask(id){
  state.tasks[id].status = 'done';
  state.tasks[id].verifiedAt = null;
  saveState(); refresh();
}
async function resetAll(){
  if(!confirm('Toto vymaže VŠETKY misie, fotky aj poznámky. Naozaj?')) return;
  if(!confirm('Posledná šanca — spomienky sa nedajú vrátiť. Vymazať?')) return;
  await clearPhotos();
  localStorage.removeItem(STATE_KEY);
  state = defaultState();
  location.reload();
}

/* ====== záloha ====== */
async function exportBackup(){
  const photos = await getAllPhotos();
  const blob = new Blob([JSON.stringify({v:1, state, photos})], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `salzburg-misia-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(file){
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!data.state || !data.photos) throw new Error('neznámy formát');
    if(!confirm('Načítanie zálohy prepíše aktuálny stav hry. Pokračovať?')) return;
    await clearPhotos();
    for(const p of data.photos) await putPhoto(p);
    state = data.state;
    saveState();
    location.reload();
  }catch(e){ alert('Zálohu sa nepodarilo načítať: ' + e.message); }
}

/* ====== navigácia a štart ====== */
function showView(v){
  activeView = v;
  for(const name of ['quests','memories','crew']){
    document.getElementById('view-'+name).hidden = name!==v;
    document.getElementById('tab-'+name).classList.toggle('active', name===v);
  }
  refresh();
  window.scrollTo({top:0});
}
function refresh(){
  renderHeader();
  if(activeView==='quests') renderQuests();
  if(activeView==='memories') renderMemories();
  if(activeView==='crew') renderCrew();
}
function finishSetup(){
  state.groom = document.getElementById('inGroom').value.trim();
  state.bride = document.getElementById('inBride').value.trim();
  state.setupDone = true;
  saveState();
  document.getElementById('setupOverlay').hidden = true;
  refresh(); confetti(30);
}

/* ====== konfety ====== */
const CONFETTI_COLORS = ['#f2b13d','#46c47d','#e9ecf2','#6ca0f5','#e5606c'];
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<n;i++){
    const b = document.createElement('div');
    b.className = 'confetti-bit';
    b.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    b.style.left = Math.random()*100 + 'vw';
    b.style.animationDuration = (2.2 + Math.random()*2.5) + 's';
    b.style.animationDelay = (Math.random()*0.6) + 's';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 6000);
  }
}

/* ====== init ====== */
document.addEventListener('DOMContentLoaded', ()=>{
  if(!state.setupDone) document.getElementById('setupOverlay').hidden = false;
  document.getElementById('lightbox').addEventListener('click', e=>{
    if(e.target.id==='lightbox') closeLightbox();
  });
  refresh();
});
</script>
